plugins {
    id 'com.android.application'
}

android {
    namespace 'com.morphoscan.pro'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.morphoscan.pro"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: ["/"]
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else if (project.hasProperty('MORPHOSCAN_STORE_FILE')) {
                storeFile file(MORPHOSCAN_STORE_FILE)
                storePassword MORPHOSCAN_STORE_PASSWORD
                keyAlias MORPHOSCAN_KEY_ALIAS
                keyPassword MORPHOSCAN_KEY_PASSWORD
            }
        }
    }

    def hasReleaseSigning = project.hasProperty('RELEASE_STORE_FILE') || project.hasProperty('MORPHOSCAN_STORE_FILE')

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "CODEPUSH_KEY", "\"\""
        }

        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "CODEPUSH_KEY", "\"\""

            // Optimize APK size
            shrinkResources true
            zipAlignEnabled true

            // Enable multidex for large apps
            multiDexEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../dist']
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Capacitor dependencies
    implementation project(':capacitor-android')

    // Additional dependencies for enhanced functionality
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Camera dependencies
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
