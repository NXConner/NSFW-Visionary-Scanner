plugins {
    id 'com.android.application'
}

// Enable Google Services plugin only when a real google-services.json is present.
// This avoids breaking local builds/CI when the file is intentionally not committed.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.morphoscan.pro'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.morphoscan.pro"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: ["/"]
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

    }

    signingConfigs {
        debug {
            def debugKeystore = file('debug.keystore')
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }

        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else if (project.hasProperty('MORPHOSCAN_STORE_FILE')) {
                storeFile file(MORPHOSCAN_STORE_FILE)
                storePassword MORPHOSCAN_STORE_PASSWORD
                keyAlias MORPHOSCAN_KEY_ALIAS
                keyPassword MORPHOSCAN_KEY_PASSWORD
            }
            // Allow unsigned release builds if no keystore is configured
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.debug.storeFile != null && signingConfigs.debug.storeFile.exists()) {
                signingConfig signingConfigs.debug
            }
            buildConfigField "String", "CODEPUSH_KEY", "\"\""
            // Debug builds keep logging
            minifyEnabled false
            shrinkResources false
        }

        release {
            // Only use release signing if keystore is configured
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
            
            // Security: Enable code obfuscation and shrinking
            minifyEnabled true
            shrinkResources true
            
            // ProGuard/R8 configuration files
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            buildConfigField "String", "CODEPUSH_KEY", "\"\""

            // Optimize APK
            zipAlignEnabled true

            // Enable multidex for large apps
            multiDexEnabled true
            
            // Disable debugging for release
            debuggable false
            
            // Additional security: disable backup for sensitive builds
            // (handled via backup_rules.xml for granular control)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Override Capacitor's Java 21 setting to use Java 17 for Kotlin compatibility
    afterEvaluate {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../dist']
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Capacitor dependencies
    implementation project(':capacitor-android')

    // Firebase Messaging (required for FCM on Android; safe even if google-services.json is absent)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Additional dependencies for enhanced functionality
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Camera dependencies
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
