# Doppler Secrets Management Configuration
# This file configures Doppler CLI for secrets injection
# Install Doppler CLI: https://docs.doppler.com/docs/cli
# Setup: doppler setup

# Environment configuration
environments:
  development:
    project: morphoscan-pro
    config: dev
  staging:
    project: morphoscan-pro
    config: staging
  production:
    project: morphoscan-pro
    config: prod

# Secrets mapping for different environments
secrets:
  # Supabase Configuration
  VITE_SUPABASE_URL: SUPABASE_URL
  VITE_SUPABASE_PUBLISHABLE_KEY: SUPABASE_ANON_KEY
  SUPABASE_SERVICE_ROLE_KEY: SUPABASE_SERVICE_ROLE_KEY

  # AI Services
  VITE_GEMINI_API_KEY: GEMINI_API_KEY

  # Payment Processing
  VITE_STRIPE_PUBLISHABLE_KEY: STRIPE_PUBLISHABLE_KEY
  STRIPE_SECRET_KEY: STRIPE_SECRET_KEY
  STRIPE_WEBHOOK_SECRET: STRIPE_WEBHOOK_SECRET

  # Push Notifications
  FIREBASE_PROJECT_ID: FIREBASE_PROJECT_ID
  FIREBASE_PRIVATE_KEY_ID: FIREBASE_PRIVATE_KEY_ID
  FIREBASE_PRIVATE_KEY: FIREBASE_PRIVATE_KEY
  FIREBASE_CLIENT_EMAIL: FIREBASE_CLIENT_EMAIL
  FIREBASE_CLIENT_ID: FIREBASE_CLIENT_ID
  FIREBASE_AUTH_URI: FIREBASE_AUTH_URI
  FIREBASE_TOKEN_URI: FIREBASE_TOKEN_URI
  FIREBASE_AUTH_PROVIDER_CERT_URL: FIREBASE_AUTH_PROVIDER_CERT_URL

  # Application
  VITE_APP_ENV: APP_ENV
  VITE_APP_VERSION: APP_VERSION
  VITE_FEATURE_FLAGS: FEATURE_FLAGS

  # Admin Configuration
  ADMIN_SUPER_EMAIL: ADMIN_EMAIL

  # Security
  VITE_ENCRYPTION_KEY: ENCRYPTION_KEY
  VITE_CLIENT_ENCRYPTION_SALT: CLIENT_SALT

# Doppler CLI commands for local development:
# doppler run -- npm run dev
# doppler run -- npm run build
# doppler run -- npm run test
