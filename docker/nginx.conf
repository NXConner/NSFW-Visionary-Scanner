server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Basic hardening (client SPA; backend is Supabase).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # SPA routing: fallback to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Ensure HTML is not cached aggressively (so deploys update quickly).
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # PWA service worker should revalidate on each load.
  location ~* ^/(?:sw\.js|service-worker\.js)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Cache fingerprinted assets for a long time.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }
}
