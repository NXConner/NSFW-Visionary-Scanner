name: Release Readiness Gates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run release readiness audit
        run: npm run check:release-readiness -- --report-file artifacts/release-readiness-report.json

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: artifacts/release-readiness-report.json
