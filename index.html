<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Preload Critical Resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://*.supabase.co" />
    <link rel="dns-prefetch" href="https://api.stripe.com" />

    <!-- Google Fonts with display=swap for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Supabase API preconnect for faster auth/data requests -->
    <link rel="preconnect" href="https://*.supabase.co" />
    
    <!-- Stripe preconnect for payment processing -->
    <link rel="preconnect" href="https://api.stripe.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>MorphoScan Pro - Advanced Men's Health Platform</title>
    <meta
      name="description"
      content="Comprehensive men's health platform for Peyronie's Disease self-assessment, growth tracking, and health monitoring. Track measurements, monitor curvature progression, and export medical reports. 100% private, works offline."
    />
    <meta name="author" content="MorphoScan Pro" />
    <meta
      name="keywords"
      content="men's health, Peyronie's disease, health monitoring, curvature measurement, health tracking, medical self-assessment, penis health, growth tracker"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://growthtracker.app" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="MorphoScan Pro - Advanced Men's Health Platform" />
    <meta
      property="og:description"
      content="Track health measurements, monitor progression, and export reports. Privacy-first, works offline."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://growthtracker.app" />
    <meta property="og:site_name" content="MorphoScan Pro" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MorphoScan Pro - Men's Health Platform" />
    <meta name="twitter:description" content="Comprehensive private health tracking for men." />

    <!-- Mobile App Meta Tags -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MorphoScan Pro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Android/Capacitor specific -->
    <meta name="color-scheme" content="dark light" />

    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192x192.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%pwa-192x192.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MorphoScan Pro",
        "description": "Comprehensive men's health platform for self-assessment and tracking",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": ["Health Tracking", "AI Analysis", "Offline Support", "Data Privacy"]
      }
    </script>

    <!-- Critical loading styles -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        z-index: 99999;
        transition: opacity 0.3s ease-out;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.7);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .loader-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        border-radius: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- Color Blind Mode SVG Filters -->
    <svg style="display: none">
      <defs>
        <!-- Protanopia (Red-Blind) Filter -->
        <filter id="protanopia-filter">
          <feColorMatrix
            type="matrix"
            values="
            0.567, 0.433, 0,     0, 0
            0.558, 0.442, 0,     0, 0
            0,     0.242, 0.758, 0, 0
            0,     0,     0,     1, 0
          "
          />
        </filter>
        <!-- Deuteranopia (Green-Blind) Filter -->
        <filter id="deuteranopia-filter">
          <feColorMatrix
            type="matrix"
            values="
            0.625, 0.375, 0,     0, 0
            0.7,   0.3,   0,     0, 0
            0,     0.3,   0.7,   0, 0
            0,     0,     0,     1, 0
          "
          />
        </filter>
        <!-- Tritanopia (Blue-Blind) Filter -->
        <filter id="tritanopia-filter">
          <feColorMatrix
            type="matrix"
            values="
            0.95, 0.05,  0,     0, 0
            0,    0.433, 0.567, 0, 0
            0,    0.475, 0.525, 0, 0
            0,    0,     0,     1, 0
          "
          />
        </filter>
      </defs>
    </svg>
    <!-- App Loading State -->
    <div id="app-loader" role="status" aria-label="Loading application">
      <img
        src="%BASE_URL%pwa-192x192.png"
        alt="MorphoScan Pro"
        class="loader-logo"
        onerror="this.style.display = 'none'"
      />
      <div class="loader-spinner" aria-hidden="true"></div>
      <div class="loader-text">Loading MorphoScan Pro...</div>
    </div>
    <script>
      // E2E + production hardening:
      // If the JS bundle fails to execute for any reason, never leave the loader stuck forever.
      (function () {
        function hideLoader() {
          var loader = document.getElementById("app-loader");
          if (!loader) return;
          loader.classList.add("fade-out");
          setTimeout(function () {
            try {
              loader.remove();
            } catch (_) {}
          }, 350);
        }
        // Absolute fallback only: allow app boot code to remove the loader first.
        // This prevents "blank screen" in slower environments where the bundle
        // may take longer to parse/execute.
        setTimeout(hideLoader, 20000);
      })();
    </script>
    <script>
      // Remote preview hardening:
      // If a stale Service Worker exists on a preview host, it can serve old assets and cause "stuck loading".
      // This MUST run before the app bundle executes.
      (function () {
        try {
          var hostname = (location.hostname || "").toLowerCase();
          var isPreview =
            hostname.indexOf("lovable") !== -1 ||
            hostname.indexOf("cursor") !== -1 ||
            hostname.endsWith(".lovableproject.com") ||
            hostname.endsWith(".lovable.dev") ||
            hostname.endsWith(".lovable.app") ||
            hostname.endsWith(".cursor.sh") ||
            hostname.endsWith(".cursor.so");

          if (!isPreview) return;

          // Best-effort: unregister SW + clear caches.
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                regs.forEach(function (r) {
                  try {
                    r.unregister();
                  } catch (_) {}
                });
              })
              .catch(function () {});
          }

          if ("caches" in window) {
            caches
              .keys()
              .then(function (keys) {
                keys.forEach(function (k) {
                  try {
                    caches.delete(k);
                  } catch (_) {}
                });
              })
              .catch(function () {});
          }
        } catch (_) {
          // ignore
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
